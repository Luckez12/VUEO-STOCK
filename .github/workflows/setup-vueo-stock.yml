name: Setup VUEO-STOCK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vueo-stock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch'
    name: Migrate to VUEO provider format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Nuvio-compatible VUEO structure
        shell: bash
        run: |
          set -euo pipefail

          rm -f registry.json
          rm -rf schemas
          rm -rf providers/example

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const write = (relativePath, content) => {
            const target = path.join(process.cwd(), relativePath);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.writeFileSync(target, content);
          };

          write('manifest.json', JSON.stringify({
            name: 'VUEO Stock',
            version: '1.0.0',
            scrapers: []
          }, null, 2) + '\n');

          write('package.json', JSON.stringify({
            name: 'vueo-stock',
            version: '1.0.0',
            private: true,
            type: 'module',
            scripts: { validate: 'node scripts/validate.mjs' },
            engines: { node: '>=20' }
          }, null, 2) + '\n');

          write('.gitignore', `node_modules/
          *.log
          .DS_Store
          `);

          write('README.md', `# VUEO-STOCK

          Official JavaScript provider repository for VUEO.

          ## Install URL

          \`https://raw.githubusercontent.com/Luckez12/VUEO-STOCK/refs/heads/main/manifest.json\`

          ## Provider contract

          Distribution files use the Nuvio-compatible CommonJS contract already supported by VUEO:

          \`\`\`javascript
          async function getStreams(tmdbId, mediaType, season, episode) {
            return [];
          }

          module.exports = { getStreams };
          \`\`\`

          Each stream may include \`name\`, \`title\`, \`url\`, \`quality\` and optional playback \`headers\`.

          Run \`npm run validate\` before publishing changes.
          `);

          write('providers/_template.js', `"use strict";

          async function getStreams(tmdbId, mediaType, season, episode) {
            return [];
          }

          module.exports = { getStreams };
          `);

          write('scripts/validate.mjs', `import fs from 'node:fs';
          import path from 'node:path';
          import vm from 'node:vm';

          const root = process.cwd();
          const fail = message => {
            console.error(\`Validation failed: \${message}\`);
            process.exit(1);
          };

          const readJson = relativePath => {
            const fullPath = path.join(root, relativePath);
            if (!fs.existsSync(fullPath)) fail(\`Missing \${relativePath}\`);
            try {
              return JSON.parse(fs.readFileSync(fullPath, 'utf8'));
            } catch (error) {
              fail(\`Invalid JSON in \${relativePath}: \${error.message}\`);
            }
          };

          const manifest = readJson('manifest.json');
          if (typeof manifest.name !== 'string' || !manifest.name.trim()) fail('manifest.name is required');
          if (!/^\\d+\\.\\d+\\.\\d+$/.test(manifest.version || '')) fail('manifest.version must use semantic versioning');
          if (!Array.isArray(manifest.scrapers)) fail('manifest.scrapers must be an array');

          const ids = new Set();
          const requiredFields = [
            'id', 'name', 'description', 'version', 'author',
            'supportedTypes', 'filename', 'enabled'
          ];

          for (const scraper of manifest.scrapers) {
            for (const field of requiredFields) {
              if (scraper[field] === undefined || scraper[field] === null) fail(\`Provider is missing \${field}\`);
            }

            if (!/^[a-z0-9][a-z0-9-]*$/.test(scraper.id)) fail(\`Invalid provider id: \${scraper.id}\`);
            if (ids.has(scraper.id)) fail(\`Duplicate provider id: \${scraper.id}\`);
            ids.add(scraper.id);

            if (!/^\\d+\\.\\d+\\.\\d+$/.test(scraper.version)) fail(\`Invalid version for \${scraper.id}\`);
            if (!Array.isArray(scraper.supportedTypes) || scraper.supportedTypes.length === 0) {
              fail(\`supportedTypes is required for \${scraper.id}\`);
            }

            const allowedTypes = new Set(['movie', 'tv']);
            for (const type of scraper.supportedTypes) {
              if (!allowedTypes.has(type)) fail(\`Unsupported media type \${type} in \${scraper.id}\`);
            }

            if (!scraper.filename.startsWith('providers/') || !scraper.filename.endsWith('.js')) {
              fail(\`Invalid filename for \${scraper.id}\`);
            }

            const providerPath = path.join(root, scraper.filename);
            if (!fs.existsSync(providerPath)) fail(\`Missing \${scraper.filename}\`);

            const source = fs.readFileSync(providerPath, 'utf8');
            const moduleObject = { exports: {} };
            const sandbox = {
              module: moduleObject,
              exports: moduleObject.exports,
              require: () => ({}),
              console,
              Promise,
              URL,
              URLSearchParams,
              setTimeout,
              clearTimeout
            };

            try {
              vm.runInNewContext(source, sandbox, { filename: scraper.filename, timeout: 2000 });
            } catch (error) {
              fail(\`Cannot load \${scraper.filename}: \${error.message}\`);
            }

            if (typeof moduleObject.exports.getStreams !== 'function') {
              fail(\`\${scraper.filename} must export getStreams\`);
            }
          }

          console.log(\`Validated VUEO-STOCK with \${manifest.scrapers.length} provider(s).\`);
          `);
          NODE

      - name: Generate lock file and validate
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm run validate

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "VUEO-STOCK already uses the current format."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "refactor: adopt VUEO provider manifest format"
          git push

  validate:
    if: github.event_name != 'workflow_dispatch'
    name: Validate VUEO-STOCK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run validate
