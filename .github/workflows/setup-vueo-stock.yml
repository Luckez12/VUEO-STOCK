name: Validate VUEO-STOCK

on:
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "providers/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/setup-vueo-stock.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vueo-stock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Nuvio provider repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run validate
          
